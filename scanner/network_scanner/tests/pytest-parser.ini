[pytest]
testpaths = .
python_files = test_pcap_scanner.py test_parser_*.py
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=scanner.network_scanner.parser.tshark_parser
    --cov=scanner.network_scanner.parser.model_adapter
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov/parser
    --cov-report=json:htmlcov/parser/coverage.json
    --cov-fail-under=100
filterwarnings = error
