[pytest]
testpaths = .
python_files = test_pcap_scanner.py test_parser_*.py test_algorithm_mapper.py test_risk_assessment.py test_cleartext_analyzer.py test_tls_analyzer.py test_ssh_analyzer.py
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=scanner.network_scanner.parser.tshark_parser
    --cov=scanner.network_scanner.pcap_scanner
    --cov=scanner.network_scanner.model_adapter
    --cov=scanner.network_scanner.algorithm_mapper
    --cov=scanner.network_scanner.Analyser.risk_assessment
    --cov=scanner.network_scanner.Analyser.cleartext_analyzer
    --cov=scanner.network_scanner.Analyser.tls_analyzer
    --cov=scanner.network_scanner.Analyser.ssh_analyzer
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov/parser
    --cov-report=json:htmlcov/parser/coverage.json
    --cov-fail-under=100
filterwarnings = error
