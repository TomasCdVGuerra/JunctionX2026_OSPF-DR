[tool.ruff]
exclude = [
    "support-materials/**",
]

[tool.ruff.lint]
ignore = ["TRY004", "SIM102", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["F401"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true
