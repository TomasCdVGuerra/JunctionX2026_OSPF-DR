name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install TShark for real capture validation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install TShark on macOS
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Validate single-command setup and complete suite
        env:
          QUANTUMTRACE_REQUIRE_TSHARK_REVIEW: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: python run.py --test ${{ runner.os != 'Windows' && '--require-tshark' || '' }}
